
<!doctype html>
<html>
    <head>
        <title>PHP To-Do List</title>

        <style>
            body {
                font-family: Arial;
                margin: 30px;
            }

            h2 {
                color: darkblue;
            }

            input {
                padding: 8px;
                width: 250px;
            }

            button {
                padding: 8px 15px;
            }
        </style>
    </head>

    <body>
        <h2>My To-Do List</h2>

        <form action="todo.php" method="POST">
            <input
                type="text"
                name="task"
                placeholder="Enter your task"
                required
            />

            <button type="submit">Add Task</button>
        </form>
    </body>
</html>
